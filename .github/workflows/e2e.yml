name: E2E Tests

on:
  push:
    paths:
      - 'e2e/**'
      - 'pages/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
  repository_dispatch:
    types: [image-updated]   # triggered by backend or frontend repo after a new image push

jobs:
  e2e:
    runs-on: ubuntu-latest
    # No container: here — with container:, services are reachable only by label
    # name (http://frontend, http://backend), which are different hostnames, so
    # SameSite=Lax cookies get dropped as cross-site and the JWT auth breaks.
    # Without container:, GitHub Actions maps services to localhost on the runner,
    # so frontend and backend share a hostname and cookies work.

    permissions:
      contents: read
      checks: write     # needed for dorny/test-reporter to post inline results

    services:
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: password
          MONGO_INITDB_DATABASE: themenbrett
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

      # SHA comes from repository_dispatch payload when triggered by backend/frontend;
      # falls back to "latest" for manual/push triggers.
      backend:
        image: ghcr.io/marlowmix/pwa_backend:${{ github.event.client_payload.backend_sha || 'latest' }}
        env:
          DB_CONNECTION_STRING: "mongodb://admin:password@mongo:27017/themenbrett?authSource=admin"
          DB_PREFILL: "true"
          USE_SSL: "false"
          HTTP_PORT: "3001"
          HTTPS_PORT: "443"
          JWT_SECRET: "ci-only-secret"
          JWT_TTL: "300"
          COOKIE_NAME: "access_token"
          CORS_ORIGIN: "http://localhost"
        ports:
          - "3001:3001"
        options: --restart on-failure:5

      frontend:
        image: ghcr.io/marlowmix/pwa_frontend:${{ github.event.client_payload.frontend_sha || 'latest' }}
        env:
          VITE_API_SERVER_URL: "http://localhost:3001"
        ports:
          - "80:80"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend on localhost:3001..."
          timeout 60 sh -c 'until curl -s http://localhost:3001/api/gebiet > /dev/null 2>&1; do sleep 2; done'
          echo "Backend is ready."

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend on localhost:80..."
          timeout 30 sh -c 'until curl -s http://localhost > /dev/null 2>&1; do sleep 2; done'
          echo "Frontend is ready."

      # --ignore-scripts skips downloading browsers; they're pre-installed in the image
      - name: Install dependencies
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.60.0-noble \
            npm ci --ignore-scripts

      # --network host shares the runner's network so the container's localhost
      # reaches frontend (80) and backend (3001) as the same site, keeping cookies valid
      - name: Run E2E tests
        run: |
          docker run --rm \
            --network host \
            --shm-size 1gb \
            -e BASE_URL="http://localhost" \
            -e CI="true" \
            -e PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD="1" \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            mcr.microsoft.com/playwright:v1.60.0-noble \
            npx playwright test

      # Containers run as root, so fix ownership for the runner user
      - name: Fix output file permissions
        if: always()
        run: sudo chown -R $(id -u):$(id -g) playwright-report results.xml 2>/dev/null || true

      - name: Publish inline test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Results
          path: results.xml
          reporter: java-junit

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
